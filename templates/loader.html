<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Processing Payment...</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 80px; background:#f8fafc; color:#111827; }
    .spinner {
      border: 8px solid #f3f3f3;
      border-top: 8px solid #4F46E5;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      margin: auto;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .card { display:inline-block; padding:24px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.08); background:white; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2 style="margin-top:18px;">Processing payment...</h2>
    <p>If you were redirected here after payment, please wait while we verify your transaction. If this page doesn't update in a few seconds, <a href="/">return to home</a>.</p>
  </div>
</body>
</html>
