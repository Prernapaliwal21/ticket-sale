<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay with GPay</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background: #f5f5f5;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      display: inline-block;
    }
    img {
      width: 250px;
      height: 250px;
    }
    h2 {
      color: #1a73e8;
    }
    p {
      font-size: 18px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Pay with Google Pay</h2>
  <p>Scan this QR code with GPay to pay:</p>
  <img id="upiQR" src="" alt="UPI QR Code">
  <p>Or use UPI ID: <strong id="upiID">yourname@upi</strong></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // Replace these with your details
  const upiId = "manansharma0621@okicici";
  const name = "Your Name";
  const note = "Payment for Order";
  const amount = "100.00"; // INR

  // UPI Payment URL format
  const upiURL = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&tn=${encodeURIComponent(note)}&am=${amount}&cu=INR`;

  // Generate QR code
  new QRCode(document.getElementById("upiQR"), {
    text: upiURL,
    width: 250,
    height: 250
  });

  // Show UPI ID
  document.getElementById("upiID").innerText = upiId;
</script>

</body>
</html>
